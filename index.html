<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Private View × Modern Masters</title>
  <meta name="description" content="A private, before-opening viewing of modern masters." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main class="gallery" id="gallery">
    <canvas class="scene" id="scene" aria-hidden="true"></canvas>

    <div class="logo" id="logo" role="img" aria-label="Private View × Modern Masters">
      <span class="logo-serif" aria-hidden="true">Private View</span>
      <span class="logo-times" aria-hidden="true">×</span>
      <span class="logo-sans" aria-hidden="true">Modern Masters</span>
    </div>

    <footer class="invitation" id="invitation">
      <time class="date" datetime="2026-10-01">Thursday, October 1st, 2026 at 9:30a</time>
      <p class="description">
        You're invited to a private, before-opening walk through the modern masters.
        Join an intimate group of fellow creatives for a morning of art and inspiration.
        Space is extremely limited.
      </p>
    </footer>

    <p class="hint" id="hint">Drag or scroll to browse</p>
  </main>

  <script type="module" src="gallery.js"></script>
</body>
</html>
